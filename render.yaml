services:
  - type: web
    name: vidhiveda-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    # Releases are triggered by .github/workflows/deploy-backend.yml through the
    # Render deploy hook, after the test job passes. Turn off Render's own
    # auto-deploy so a push cannot ship untested code.
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"
      # Restrict the browser origin; the app also always allows *.vercel.app.
      - key: CORS_ORIGINS
        value: "https://frontend-akon2005s-projects.vercel.app"
      - key: LLM_PROVIDER
        value: "huggingface"
      - key: TOP_K
        value: "8"
      # The container ships with the committed corpus at /app/chroma_db.
      - key: VECTOR_STORE_DIR
        value: "/app/chroma_db"
      - key: CASE_LAW_COLLECTION
        value: "vidhiveda_legal_cases"
      # Secrets: set these in the Render dashboard (or as GitHub secrets for the
      # CI test job). sync:false keeps them out of the blueprint and this repo.
      - key: HF_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
