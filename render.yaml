services:
  - type: web
    name: vidhiveda-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: "huggingface"
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: OPENAI_API_KEY
        value: ""
      - key: HF_API_TOKEN
        value: ""
