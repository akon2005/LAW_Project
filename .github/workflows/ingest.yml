name: Ingest Legal Corpus

# Controlled, manually-triggered corpus ingestion. This is the ONLY workflow
# allowed to touch the vector store, so routine code pushes never re-embed the
# 9,375-chunk dataset. A full run requires typing INGEST as confirmation.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample | full | resume"
        type: choice
        options: [sample, full, resume]
        default: sample
      limit:
        description: "Records to process for a sample run"
        type: number
        default: 1000
      confirm:
        description: "Type INGEST to authorise a full-corpus run"
        required: false
        default: ""

concurrency:
  group: ingest-corpus
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest and commit vector store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Guard full-corpus runs
        if: ${{ github.event.inputs.mode == 'full' && github.event.inputs.confirm != 'INGEST' }}
        run: |
          echo "::error::A full-corpus run requires typing INGEST in the confirm field."
          exit 1

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            full)   python scripts/ingest.py --full ;;
            resume) python scripts/ingest.py --resume ;;
            *)      python scripts/ingest.py --sample ${{ github.event.inputs.limit }} ;;
          esac
          python scripts/ingest.py --status

      - name: Commit the refreshed vector store
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backend/chroma_db
          if git diff --cached --quiet; then
            echo "Vector store unchanged; nothing to commit."
          else
            git commit -m "Refresh legal corpus vector store (${{ github.event.inputs.mode }})"
            git push
          fi
