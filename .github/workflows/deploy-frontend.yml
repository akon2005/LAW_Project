name: Deploy Frontend (Vercel)

# Production frontend deploy. Only runs when the frontend or its Vercel config
# changes, so backend-only or docs-only pushes do not rebuild the site.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build

  deploy:
    name: Build and deploy to Vercel
    needs: check
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Baked into the bundle at build time. Points the UI at the production API.
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fail early if Vercel credentials are missing
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is not set"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is not set"; exit 1; }
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "::error::VERCEL_TOKEN secret is not set"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build project artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt artifacts to production
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "Deployed to: $url"
          echo "### Frontend deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify production frontend
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check frontend availability
        run: |
          url="https://frontend-akon2005s-projects.vercel.app"
          echo "Checking $url ..."
          code="$(curl -s -o /dev/null -w "%{http_code}" -L "$url" || true)"
          echo "HTTP status code: $code"
          if [ "$code" = "200" ] || [ "$code" = "302" ]; then
            echo "Frontend is accessible (HTTP $code)"
            echo "### Frontend accessible: $url (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Frontend returned HTTP $code"
          fi

