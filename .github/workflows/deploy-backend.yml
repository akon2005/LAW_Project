name: Deploy Backend (Render)

# Production backend + RAG deploy. Runs only when backend code, the serverless
# shim, the deployment blueprint, or this workflow changes. The full backend
# (ChromaDB, sentence-transformers, torch) is deployed as a Docker image on
# Render; Vercel only ever serves the frontend.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "api/**"
      - "render.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Backend + RAG tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (includes retrieval/ranking/RAG unit tests)
        run: python -m unittest discover -s tests -t . -v

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Fail early if the deploy hook is missing
        run: |
          test -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            || { echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; }

      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy hook accepted."

  verify:
    name: Verify production health
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Poll /health until the new revision is live
        run: |
          base="${{ vars.BACKEND_URL }}"
          if [ -z "$base" ]; then
            echo "BACKEND_URL variable is not set; falling back to https://vidhiveda-backend.onrender.com"
            base="https://vidhiveda-backend.onrender.com"
          fi
          base="${base%/}"
          echo "Waiting for $base/health ..."

          for attempt in $(seq 1 40); do
            body="$(curl -fsS --max-time 10 "$base/health" || true)"
            if echo "$body" | grep -q '"status":"healthy"'; then
              echo "Backend healthy: $body"
              echo "### Backend healthy: $base/health" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet"
            sleep 15
          done
          echo "::error::Backend did not become healthy within the timeout"
          exit 1
